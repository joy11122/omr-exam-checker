name: CI

on:
  pull_request:
  push:
    branches: [main, 'phase-**']

permissions:
  contents: read

jobs:
  web:
    name: Web lint, types, and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run build:web

  omr-engine:
    name: Python service tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/omr-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/omr-engine/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
