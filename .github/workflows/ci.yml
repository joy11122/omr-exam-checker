name: CI

on:
  pull_request:
  push:
    branches: [main, 'phase-**']

permissions:
  contents: read

jobs:
  web:
    name: Web lint, types, grading and analytics tests, and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const report = require('./npm-audit.json'); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(name + ': ' + item.severity + ', fix=' + JSON.stringify(item.fixAvailable));"
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:grading
      - run: npm run test:analytics
      - run: npm run test:billing
      - run: npm run test:reports
      - run: npm run test:security
      - run: npm run test:native
      - run: npm run build:web

  omr-engine:
    name: Python service tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/omr-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/omr-engine/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

  android:
    name: Android Capacitor debug build
    runs-on: ubuntu-latest
    env:
      CAPACITOR_SERVER_URL: https://omr-exam-checker.invalid
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install
      - run: npx cap add android --project-dir apps/web
      - run: node scripts/android-configure.mjs
      - run: npx cap sync android --project-dir apps/web
      - run: node scripts/verify-android-project.mjs
      - run: cd apps/web/android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: omr-exam-checker-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
