<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f9fb">
    <title>OMR Exam Checker</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f8f9fb; color: #202123; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #e6e8ec; border-radius: 18px; background: white; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { color: #737780; font-size: 14px; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main>
      <h1>OMR Exam Checker</h1>
      <p>This Android app needs the secure application URL configured during its build. Set CAPACITOR_SERVER_URL to your deployed HTTPS Next.js application, then sync the Android project again.</p>
    </main>
  </body>
</html>
